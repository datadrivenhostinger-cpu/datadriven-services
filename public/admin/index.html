<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – DataDriven CMS</title>
    <meta name="robots" content="noindex, nofollow" />
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <style>
      /* Custom login screen override */
      #cms-login-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f9ff;
        font-family: 'Inter', system-ui, sans-serif;
      }
      #cms-login-overlay.hidden { display: none; }

      .login-card {
        background: #fff;
        border-radius: 24px;
        padding: 48px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 2px 4px rgba(19,18,16,.05), 0 24px 48px -20px rgba(19,18,16,.28);
      }
      .login-card img { height: 44px; width: auto; margin-bottom: 32px; }
      .login-card h1 {
        font-size: 1.55rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #131210;
        margin-bottom: 8px;
      }
      .login-card p {
        font-size: 14.5px;
        color: #6b665d;
        margin-bottom: 28px;
      }
      .login-card label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #131210;
        margin-bottom: 6px;
        margin-top: 16px;
      }
      .login-card input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px 18px;
        border-radius: 14px;
        border: 1.5px solid #cfe3f6;
        font-size: 15px;
        color: #131210;
        background: #f4f9ff;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
      }
      .login-card input:focus {
        border-color: #0141e1;
        box-shadow: 0 0 0 3px rgba(1,65,225,.12);
        background: #fff;
      }
      .login-card button {
        margin-top: 28px;
        width: 100%;
        padding: 15px;
        border-radius: 14px;
        border: none;
        background: #091b65;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background .2s;
      }
      .login-card button:hover { background: #0141e1; }
      .login-card .error {
        margin-top: 14px;
        padding: 12px 16px;
        border-radius: 10px;
        background: #fff0f0;
        color: #c0392b;
        font-size: 13.5px;
        display: none;
      }
      .login-card .error.show { display: block; }
      .login-card .forgot {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #6b665d;
      }
    </style>
  </head>
  <body>
    <!-- Custom login overlay — shown before CMS loads -->
    <div id="cms-login-overlay">
      <div class="login-card">
        <img src="/admin/dd-logo.svg" alt="DataDriven" onerror="this.style.display='none'" />
        <h1>CMS Login</h1>
        <p>Sign in to manage DataDriven blog posts and content.</p>

        <form id="cms-login-form" autocomplete="on">
          <label for="cms-user">Username</label>
          <input id="cms-user" name="username" type="text" placeholder="Enter username" autocomplete="username" required />

          <label for="cms-pass">Password</label>
          <input id="cms-pass" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required />

          <button type="submit">Sign In to CMS</button>
        </form>
        <div class="error" id="cms-error">Incorrect username or password. Please try again.</div>
        <span class="forgot">Trouble signing in? Contact the site administrator.</span>
      </div>
    </div>

    <script>
      // ─── Credentials ───
      const USERS_PLAIN = {
        "admin": "Admin@123",
        "editor": "Editor@123"
      };

      const overlay  = document.getElementById('cms-login-overlay');
      const form     = document.getElementById('cms-login-form');
      const errorEl  = document.getElementById('cms-error');
      const SESSION_KEY = 'dd_cms_authed';

      function initCMS() {
        if (typeof window.CMS === 'undefined') {
          setTimeout(initCMS, 100);
          return;
        }
        window.CMS.init({
          config: {
            backend: {
              name: 'github',
              repo: 'datadrivenhostinger-cpu/datadriven-services',
              branch: 'main',
              auth_type: 'implicit',
              app_id: 'Ov23lieIr8Pb2vs01r0r'
            },
            media_folder: 'public/uploads',
            public_folder: '/uploads',
            site_url: 'https://datadriven-services.vercel.app',
            collections: [
              {
                name: 'blog',
                label: 'Blog Posts',
                label_singular: 'Blog Post',
                folder: 'public/content/blog',
                create: true,
                slug: '{{slug}}',
                fields: [
                  { label: 'Title', name: 'title', widget: 'string' },
                  { label: 'Slug', name: 'slug', widget: 'string', required: false },
                  { label: 'Publish Date', name: 'date', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false },
                  { label: 'Author', name: 'author', widget: 'select', options: ['karthik','kumaresan','rajkumar','sivasakthi','team'], default: 'team' },
                  { label: 'Category', name: 'category', widget: 'select', options: ['Digital Marketing','Email Marketing','SEO','Social Media','Content Marketing','Tips & Tricks','News'], default: 'Digital Marketing' },
                  { label: 'Tags', name: 'tags', widget: 'list', required: false },
                  { label: 'Cover Image', name: 'coverImage', widget: 'image', required: false },
                  { label: 'Cover Image Alt', name: 'coverImageAlt', widget: 'string', required: false },
                  { label: 'Excerpt', name: 'excerpt', widget: 'text' },
                  { label: 'Body', name: 'body', widget: 'markdown' },
                  { label: 'Featured', name: 'featured', widget: 'boolean', default: false, required: false },
                  { label: 'Draft', name: 'draft', widget: 'boolean', default: false, required: false }
                ]
              }
            ]
          }
        });
      }

      // Check if already authenticated this session
      if (sessionStorage.getItem(SESSION_KEY) === '1') {
        overlay.classList.add('hidden');
        initCMS();
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('cms-user').value.trim();
        const password = document.getElementById('cms-pass').value;
        errorEl.classList.remove('show');

        if (USERS_PLAIN[username] === password) {
          sessionStorage.setItem(SESSION_KEY, '1');
          overlay.classList.add('hidden');
          initCMS();
          return;
        }

        errorEl.classList.add('show');
      });
    </script>
  </body>
</html>
