backend:
  name: github
  repo: datadrivenhostinger-cpu/datadriven-services
  branch: main
  auth_type: implicit
  app_id: Ov23lieIr8Pb2vs01r0r

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://datadriven.services.vercel.app
display_url: https://datadriven.services.vercel.app
logo_url: /admin/dd-logo.svg

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "public/content/blog"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} – {{date}}"
    sortable_fields: ["date", "title", "author"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Author"
        name: "author"
        widget: "select"
        options:
          - { label: "Karthik", value: "karthik" }
          - { label: "Kumaresan", value: "kumaresan" }
          - { label: "RajKumar", value: "rajkumar" }
          - { label: "Sivasakthi", value: "sivasakthi" }
          - { label: "DataDriven Team", value: "team" }
        default: "team"
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Digital Marketing"
          - "Email Marketing"
          - "SEO"
          - "Social Media"
          - "Content Marketing"
          - "Tips & Tricks"
          - "News"
        default: "Digital Marketing"
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Cover Image Alt", name: "coverImageAlt", widget: "string", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false }
