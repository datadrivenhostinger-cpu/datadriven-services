backend:
  name: github
  repo: sakthirathi87/datadriven-services
  branch: main
  base_url: https://datadriven-services.com   # ← your Vercel domain (no trailing slash)
  auth_endpoint: /api/auth

# ── Local development (no backend needed) ────────────────────────────────────
# Swap to test-repo while coding locally:
# backend:
#   name: test-repo

# Media files will be stored in the repo under public/uploads
media_folder: "public/uploads"
public_folder: "/uploads"

# Site URL for previews
site_url: https://datadriven-services.com
display_url: https://datadriven-services.com
logo_url: /admin/dd-logo.svg

# Publish mode: editorial_workflow enables draft / in-review / ready states
publish_mode: editorial_workflow

# ─── Collections ────────────────────────────────────────────────────────────
collections:
  # ── Blog Posts ────────────────────────────────────────────────────────────
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "public/content/blog"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title", "author"]
    view_groups:
      - label: Category
        field: category
      - label: Author
        field: author
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The main heading for the blog post. Keep it under 70 characters."

      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL path for the post, e.g. 'email-marketing-tips'. Auto-generated from title if left blank."
        required: false

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        default: ""
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "Date the post is published."

      - label: "Author"
        name: "author"
        widget: "select"
        options:
          - { label: "Karthik", value: "karthik" }
          - { label: "Kumaresan", value: "kumaresan" }
          - { label: "RajKumar", value: "rajkumar" }
          - { label: "Sivasakthi", value: "sivasakthi" }
          - { label: "DataDriven Team", value: "team" }
        default: "team"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Digital Marketing"
          - "Email Marketing"
          - "SEO"
          - "Social Media"
          - "Content Marketing"
          - "Data Services"
          - "Case Studies"
          - "Tips & Tricks"
          - "News"
        default: "Digital Marketing"

      - label: "Tags"
        name: "tags"
        widget: "list"
        allow_add: true
        hint: "Comma-separated tags, e.g. email, b2b, leads"
        required: false

      - label: "Cover Image"
        name: "coverImage"
        widget: "image"
        hint: "Recommended size: 1200×630px"
        required: false
        media_library:
          config:
            multiple: false

      - label: "Cover Image Alt Text"
        name: "coverImageAlt"
        widget: "string"
        required: false
        hint: "Describe the image for screen readers and SEO."

      - label: "Excerpt / Meta Description"
        name: "excerpt"
        widget: "text"
        hint: "Short summary shown in blog list cards and as the meta description (150–160 characters)."
        pattern:
          - ".{30,}"
          - "Please write at least 30 characters."

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Full blog post content. Use the toolbar to add headings, images, links, and lists."
        buttons:
          - bold
          - italic
          - link
          - heading-one
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
          - code
        editor_components:
          - image
          - code-block

      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Pin this post to the top of the blog list."
        required: false

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
        hint: "Unpublish without deleting."
        required: false

      - label: "SEO Title"
        name: "seoTitle"
        widget: "string"
        required: false
        hint: "Override the browser tab title (60–70 chars). Defaults to post title + ' | DataDriven'."

      - label: "Canonical URL"
        name: "canonical"
        widget: "string"
        required: false
        hint: "Set only if this content was originally published elsewhere."

  # ── Site Settings ────────────────────────────────────────────────────────
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Blog Settings"
        name: "blog_settings"
        file: "public/content/settings/blog.json"
        fields:
          - label: "Blog Page Title"
            name: "pageTitle"
            widget: "string"
            default: "Blog – DataDriven Services"

          - label: "Blog Page Description"
            name: "pageDesc"
            widget: "text"
            default: "Digital marketing tips, email strategies, SEO guides and industry insights from the DataDriven team."

          - label: "Posts Per Page"
            name: "postsPerPage"
            widget: "number"
            default: 9
            value_type: "int"
            min: 3
            max: 30

          - label: "Featured Post Slug"
            name: "featuredPost"
            widget: "string"
            required: false
            hint: "Slug of the post to always show first. Leave blank to use most recent."

